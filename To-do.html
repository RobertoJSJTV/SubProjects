<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome -->
    <script defer src="https://use.fontawesome.com/releases/v5.0.8/js/all.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- JavaScript -->
    <script src="ProjetoTO-DO/js/Script.js"></script>

    <link rel="stylesheet" href="ProjetoTO-DO/css/style.css">

    <title>Lista de Tarefas</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">
            <i class="fa-solid fa-angle-left me-5" style="color: white; font-size: 50px; cursor: pointer;"
                aria-label="botão de voltar" onclick="window.location.href='index.html'"></i>
            <div class="container d-flex justify-content-end ">
                <button class="btn btn-outline-info me-1" onclick="CriarLista()">Criar</button>
                <button class="btn btn-outline-info"><i class="fas fa-ellipsis-h" onclick="Configuracao()"></i></button>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row" id="colunas">
            <div class="col-md-3 pt-4" id="card">
                <div class="card">
                    <div class="card-header">
                        <h3 class="tituloTex" id="tituloTexto" onclick="MudarNome()">texto</h3>
                    </div>
                    <div class="card-body">
                        <form id="taskForm" class="input my-3">
                            <input type="text" id="textInput" class="form-control">
                            <button class="btn btn-primary mt-3" onclick="AdicionarCart()">Adicionar cartão</button><button type="button" class="btn-close ms-3" data-bs-dismiss="modal" aria-label="Close"></button>
                        </form>
                        <ul id="taskList" class="list-group mb-3" ></ul>
                        <p class="btn btn-add-cartao" id="adicionarCartao" aria-placeholder="+ adicionar Cartão"
                            onclick="adicionarCartao()"><i class="fa fa-plus" aria-hidden="true"></i>
                            adicionar cartão</p>
                    </div>
                </div>
            </div>

        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
