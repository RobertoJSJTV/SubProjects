<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body.dark {
      background-color: #121212;
      color: white;
    }
    .dark .card {
      background-color: #1e1e1e;
      color: white;
    }
    .completed {
      text-decoration: line-through;
      opacity: 0.6;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center">
        <h3>📌 To-Do List</h3>
        <button id="darkModeBtn" class="btn btn-secondary btn-sm">🌙 Modo Escuro</button>
      </div>

      <!-- Form -->
      <form id="taskForm" class="input-group my-3">
        <input type="text" id="taskInput" class="form-control" placeholder="Digite uma tarefa..." required>
        <button class="btn btn-primary">Adicionar</button>
      </form>

      <!-- Filtros -->
      <div class="btn-group mb-3">
        <button class="btn btn-outline-primary filter-btn" data-filter="all">Todas</button>
        <button class="btn btn-outline-warning filter-btn" data-filter="pending">Pendentes</button>
        <button class="btn btn-outline-success filter-btn" data-filter="completed">Concluídas</button>
      </div>

      <!-- Lista -->
      <ul id="taskList" class="list-group mb-3"></ul>

      <!-- Barra de Progresso -->
      <div class="progress">
        <div id="progressBar" class="progress-bar bg-success" style="width: 0%">0%</div>
      </div>

    </div>
  </div>
</div>

<script>
  const taskForm = document.getElementById("taskForm");
  const taskInput = document.getElementById("taskInput");
  const taskList = document.getElementById("taskList");
  const progressBar = document.getElementById("progressBar");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const darkModeBtn = document.getElementById("darkModeBtn");

  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
  let currentFilter = "all";

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function updateProgress() {
    const completed = tasks.filter(t => t.completed).length;
    const total = tasks.length;
    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
    progressBar.style.width = percent + "%";
    progressBar.textContent = percent + "%";
  }

  function renderTasks() {
    taskList.innerHTML = "";

    tasks
      .filter(task => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      })
      .forEach((task, index) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        const span = document.createElement("span");
        span.textContent = task.text;
        if (task.completed) span.classList.add("completed");

        span.addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn btn-danger btn-sm";
        deleteBtn.textContent = "X";
        deleteBtn.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });

    updateProgress();
  }

  taskForm.addEventListener("submit", (e) => {
    e.preventDefault();
    tasks.push({ text: taskInput.value, completed: false });
    taskInput.value = "";
    saveTasks();
    renderTasks();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  darkModeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
  });

  renderTasks();
</script>

</body>
</html>
